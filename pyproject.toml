[project]
name = "agml-agent"
version = "0.1.0"
description = "Agentic toolkit for AgML: live external grounding (retrieve) + AgML catalog search (search_agml), exposed via MCP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Project-AgML" },
]
urls = { Repository = "https://github.com/Project-AgML/agml-agent" }
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "trafilatura>=1.8",
    "ddgs>=9.0",
    "agml>=0.8.1",
    "mcp>=2.2.0",
    "ollama>=0.6.2",
]

[project.optional-dependencies]
# Benchmarking on AGgentic-benchmarks (private repo; needs GitHub SSH access): uv sync --extra bench
bench = [
    "agbench",
]

[project.scripts]
agml-agent-mcp = "agml_agent.mcp_server:main"
agml-agent-retrieve = "agml_agent.retrieve:main"
agml-agent-search = "agml_agent.search_agml:main"
agml-agent-chat = "agml_agent.chat:main"
agml-agent-bench = "agml_agent.bench:main"
agml-agent-view = "agml_agent.bench_view:main"

[tool.uv.sources]
# Pinned: harness runs must use the exact benchmark code the baselines were run with. Bump `rev`
# only together with re-running the baselines.
agbench = { git = "ssh://git@github.com/plant-ai-biophysics-lab/AGgentic-benchmarks", rev = "e0ff6b74f3a427508a7052708015535586bd3ec0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agml_agent"]

[dependency-groups]
dev = [
    "pytest",
]
